name: Release macOS installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft GitHub release tag to upload the macOS installer to.
        required: true
        default: v0.5.0
      ref:
        description: Full 40-character commit SHA to build.
        required: true

permissions:
  contents: write

concurrency:
  group: release-macos-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build and verify the Universal macOS installer
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require an immutable source commit
        shell: python
        run: |
          import os
          import re
          if not re.fullmatch(r"[0-9a-fA-F]{40}", os.environ["SOURCE_SHA"]):
              raise SystemExit("Supply ref as a full 40-character commit SHA, not a branch or tag.")

      - name: Checkout the requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Check source, versions, draft release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          root = pathlib.Path.cwd()
          sha = os.environ["SOURCE_SHA"].lower()
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("ref must be a full 40-character commit SHA.")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if head != sha:
              raise SystemExit(f"Checkout HEAD {head} does not match requested source {sha}.")
          package = json.loads((root / "package.json").read_text())
          lock = json.loads((root / "package-lock.json").read_text())
          tauri = json.loads((root / "src-tauri/tauri.conf.json").read_text())
          cargo = tomllib.loads((root / "src-tauri/Cargo.toml").read_text())
          cargo_lock = tomllib.loads((root / "src-tauri/Cargo.lock").read_text())
          rust_packages = [entry for entry in cargo_lock["package"] if entry["name"] == cargo["package"]["name"]]
          version = package["version"]
          versions = [lock["version"], lock["packages"][""]["version"], tauri["version"], cargo["package"]["version"]]
          if len(rust_packages) != 1 or rust_packages[0]["version"] != version or any(value != version for value in versions):
              raise SystemExit("Package, npm lock, Tauri, Cargo manifest and Cargo lock versions must match.")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) or tag != f"v{version}":
              raise SystemExit("Release tag must match the stable source version.")
          if tauri["bundle"].get("createUpdaterArtifacts") is not True:
              raise SystemExit("Signed updater artifacts must be enabled for this release.")
          if not tauri.get("plugins", {}).get("updater", {}).get("pubkey"):
              raise SystemExit("The updater public key is missing.")
          expected_resources = {"../plugins/aivatar-session-bridge/", "../scripts/*.mjs", "../scripts/*.py", "../scripts/*.swift"}
          if set(tauri["bundle"]["resources"]) != expected_resources:
              raise SystemExit("Resources must use the approved plugin directory and top-level script globs.")
          subprocess.run(["git", "diff", "--exit-code", "HEAD", "--", "package.json", "package-lock.json", "src-tauri/tauri.conf.json", "src-tauri/Cargo.toml", "src-tauri/Cargo.lock"], check=True)

          def api(endpoint):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{endpoint}"], text=True))

          release = json.loads(subprocess.check_output(["gh", "release", "view", tag, "--repo", repo, "--json", "tagName,isDraft,targetCommitish"], text=True))
          if release["tagName"] != tag or not release["isDraft"]:
              raise SystemExit("The requested existing release must still be a draft matching the source version.")
          if release["targetCommitish"].lower() != sha:
              raise SystemExit("Create the draft with --target set to the requested full source SHA.")
          references = api(f"git/matching-refs/tags/{tag}")
          matching = [entry for entry in references if entry["ref"] == f"refs/tags/{tag}"]
          if len(matching) > 1:
              raise SystemExit("Ambiguous release tag reference.")
          if matching:
              target_object = matching[0]["object"]
              for _ in range(10):
                  if target_object["type"] != "tag":
                      break
                  target_object = api(f"git/tags/{target_object['sha']}")["object"]
              if target_object["type"] != "commit" or target_object["sha"] != sha:
                  raise SystemExit("The existing release tag does not point to the requested source commit.")
          # A draft may not create its tag until publication; its full target SHA was checked above.
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"RELEASE_VERSION={version}\n")
          # Re-run this exact check immediately before uploading to catch draft/tag drift.
          guard_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "aivatar-release-guard.py"
          if pathlib.Path(__file__).resolve() != guard_path.resolve():
              guard_path.write_text(pathlib.Path(__file__).read_text(), encoding="utf-8")
          print(f"Verified draft {tag}, source {sha}, versions and resource allowlist.")

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust for both Mac architectures
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Check persistence without launching the application
        shell: python
        run: |
          import subprocess
          for script in (
              "aivatar-save-store-smoke.mjs", "aivatar-save-persistence-smoke.mjs",
              "aivatar-room-save-persistence-smoke.mjs", "aivatar-close-save-smoke.mjs",
              "aivatar-park-persistence-smoke.mjs", "aivatar-card-room-close-save-smoke.mjs",
              "aivatar-park-smoke.mjs", "card-room-holdem-rules-smoke.mjs",
              "aivatar-desktop-mode-smoke.mjs", "aivatar-updater-release-smoke.mjs",
              "aivatar-updater-frontend-smoke.mjs",
          ):
              subprocess.run(["node", f"scripts/{script}"], check=True)
          import os
          import pathlib
          test_env = dict(os.environ, CARGO_TARGET_DIR=str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "aivatar-storage-core-target"))
          subprocess.run(["cargo", "test", "--locked", "--manifest-path", "scripts/wal-diagnostics/save-store-rust-tests/Cargo.toml"], check=True, env=test_env)

      - name: Build the Tauri Universal DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY must be configured before building release updates." >&2
            exit 1
          fi
          npm run tauri -- build --target universal-apple-darwin --bundles "app,dmg" --ci -- --locked

      - name: Verify the mounted installer and write checksums
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import plistlib
          import subprocess
          import tarfile
          import tempfile

          root = pathlib.Path.cwd()
          version = json.loads((root / "package.json").read_text())["version"]
          bundle_root = root / "src-tauri/target/universal-apple-darwin/release/bundle"
          assets = sorted((bundle_root / "dmg").glob("*.dmg"))
          expected_name = f"Aivatar_{version}_universal.dmg"
          if len(assets) != 1 or assets[0].name != expected_name:
              raise SystemExit(f"Expected exactly one installer named {expected_name}.")
          dmg = assets[0]
          subprocess.run(["hdiutil", "verify", str(dmg)], check=True)
          mount = pathlib.Path(tempfile.mkdtemp(prefix="aivatar-dmg-check-", dir=os.environ["RUNNER_TEMP"]))
          mounted = False
          try:
              subprocess.run(["hdiutil", "attach", "-readonly", "-nobrowse", "-mountpoint", str(mount), str(dmg)], check=True)
              mounted = True
              app = mount / "Aivatar.app"
              info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
              if info.get("CFBundleShortVersionString") != version or info.get("CFBundleVersion") != version:
                  raise SystemExit("The mounted application version does not match package.json.")
              if info.get("CFBundleIdentifier") != "com.aivatar.desktop":
                  raise SystemExit("Unexpected application bundle identifier.")
              executable = app / "Contents/MacOS" / info["CFBundleExecutable"]
              architectures = sorted(subprocess.check_output(["lipo", "-archs", str(executable)], text=True).split())
              if architectures != ["arm64", "x86_64"]:
                  raise SystemExit("The mounted application must contain arm64 and x86_64.")
              built_executable = bundle_root.parent / "aivatar"
              if executable.read_bytes() != built_executable.read_bytes():
                  raise SystemExit("The mounted executable differs from the freshly built executable.")
              resource_root = app / "Contents/Resources/_up_"
              required = [
                  "scripts/aivatar-learning-worker.mjs",
                  "scripts/aivatar-save-persistence-smoke.mjs",
                  "scripts/aivatar-codex-native-smoke.py",
                  "plugins/aivatar-session-bridge/scripts/aivatar-watch.mjs",
              ]
              for relative in required:
                  if not (resource_root / relative).is_file():
                      raise SystemExit(f"Missing packaged resource: {relative}")
              expected_resources = {
                  source.relative_to(root)
                  for extension in ("*.mjs", "*.py", "*.swift")
                  for source in (root / "scripts").glob(extension)
                  if source.is_file()
              }
              expected_resources.update(
                  source.relative_to(root)
                  for source in (root / "plugins/aivatar-session-bridge").rglob("*")
                  if source.is_file()
              )
              forbidden = {"wal-diagnostics", "target", "node_modules", "synthetic-test-data"}
              for packaged in resource_root.rglob("*"):
                  relative = packaged.relative_to(resource_root)
                  if forbidden.intersection(relative.parts):
                      raise SystemExit(f"Forbidden test/build resource: {relative}")
                  if relative.parts[0] == "scripts" and (packaged.is_dir() or len(relative.parts) != 2 or packaged.suffix not in {".mjs", ".py", ".swift"}):
                      if relative != pathlib.Path("scripts"):
                          raise SystemExit(f"Only top-level scripts may be packaged: {relative}")
              actual_resources = {source.relative_to(resource_root) for source in resource_root.rglob("*") if source.is_file()}
              if actual_resources != expected_resources:
                  raise SystemExit(f"Resource allowlist mismatch; missing={expected_resources - actual_resources}, extra={actual_resources - expected_resources}")
              for relative in sorted(expected_resources):
                  if (root / relative).read_bytes() != (resource_root / relative).read_bytes():
                      raise SystemExit(f"Packaged resource mismatch: {relative}")
              updater_archive = bundle_root / "macos/Aivatar.app.tar.gz"
              # Inspect the archive without extracting or launching it. Every updater
              # file must be identical to the already verified application in the DMG.
              archive_files = set()
              with tarfile.open(updater_archive, "r:gz") as archive:
                  for member in archive.getmembers():
                      relative = pathlib.PurePosixPath(member.name)
                      if relative.is_absolute() or ".." in relative.parts or not relative.parts or relative.parts[0] != "Aivatar.app":
                          raise SystemExit(f"Unsafe updater archive path: {member.name}")
                      target = mount.joinpath(*relative.parts)
                      if member.isdir():
                          if not target.is_dir():
                              raise SystemExit(f"Unexpected updater directory: {member.name}")
                      elif member.issym():
                          if not target.is_symlink() or os.readlink(target) != member.linkname:
                              raise SystemExit(f"Updater symlink mismatch: {member.name}")
                          archive_files.add(relative)
                      elif member.isfile():
                          if relative in archive_files or not target.is_file() or archive.extractfile(member).read() != target.read_bytes():
                              raise SystemExit(f"Updater archive file mismatch: {member.name}")
                          archive_files.add(relative)
                      else:
                          raise SystemExit(f"Unsupported updater archive member: {member.name}")
              mounted_files = {pathlib.PurePosixPath(path.relative_to(mount).as_posix()) for path in app.rglob("*") if path.is_file() or path.is_symlink()}
              if archive_files != mounted_files:
                  raise SystemExit("Updater archive file list differs from the mounted application.")
              resource_count = len(expected_resources)
              with dmg.open("rb") as stream:
                  checksum = hashlib.file_digest(stream, "sha256").hexdigest()
              report = {
                  "version": version,
                  "sourceCommit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  "assets": [{"name": dmg.name, "size": dmg.stat().st_size, "sha256": checksum}],
                  "verification": {
                      "dmgChecksumValid": True,
                      "mountedReadOnly": True,
                      "bundleVersion": info["CFBundleVersion"],
                      "architectures": architectures,
                      "mountedExecutableMatchesBuild": True,
                      "resourceFilesMatchSource": resource_count,
                      "updaterArchiveMatchesMountedApplication": True,
                      "requiredResources": required,
                      "applicationLaunched": False,
                  },
              }
              pathlib.Path("macos-release-checksums.json").write_text(json.dumps(report, indent=2) + "\n")
              print(json.dumps(report, indent=2))
          finally:
              if mounted or os.path.ismount(mount):
                  subprocess.run(["hdiutil", "detach", str(mount)], check=True)
          PY

      - name: Verify updater signatures and write macOS update metadata
        run: |
          node scripts/aivatar-updater-release.mjs platform \
            --platform macos --bundle-root src-tauri/target/universal-apple-darwin/release/bundle \
            --version "$RELEASE_VERSION" --source "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" \
            --config src-tauri/tauri.conf.json --checksums macos-release-checksums.json --output updater-macos.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aivatar-macos-installer-${{ inputs.tag }}
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            macos-release-checksums.json
            updater-macos.json

      - name: Upload assets to the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/aivatar-release-guard.py"
          # latest.json is deliberately assembled only after BOTH platform jobs pass.
          gh release upload "$RELEASE_TAG" \
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig \
            macos-release-checksums.json updater-macos.json --repo "$GITHUB_REPOSITORY"
