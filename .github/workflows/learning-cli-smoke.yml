name: Learning CLI compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-cli:
    name: Synthetic learning CLI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify Windows command argument fidelity
        run: node scripts/aivatar-learning-command-smoke.mjs
      - name: Verify isolated provider processes
        if: ${{ !cancelled() }}
        run: node scripts/aivatar-learning-cli-smoke.mjs
