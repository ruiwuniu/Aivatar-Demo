name: Updater security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: updater-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    name: Release signing policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned workflow parser
        run: python -m pip install PyYAML==6.0.3
      - name: Exercise real workflow guards and signature verification
        run: python scripts/security/updater-workflow-smoke.py

  updater-security:
    name: Updater security
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build frontend
        run: npm run build
      - name: Check signatures and save coordination
        run: |
          node scripts/aivatar-updater-release-smoke.mjs
          node scripts/aivatar-updater-frontend-smoke.mjs
          node scripts/aivatar-close-save-smoke.mjs
          node scripts/aivatar-save-persistence-smoke.mjs
      - name: Test native updater and bounded transport
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib app_updater
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p tauri-plugin-updater --lib
