<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Aivatar click-through QA</title>
<style>html,body{margin:0;height:100%;background:#243347;color:#fff;font:24px system-ui}button{width:100%;height:100%;border:0;background:transparent;color:inherit;font:inherit}strong{display:block;font-size:48px}</style>
<button type="button" id="target">Isolated desktop click-through target<strong id="count">Clicks: 0</strong></button>
<script>let clicks=0;document.querySelector('#target').addEventListener('click',()=>document.querySelector('#count').textContent=`Clicks: ${++clicks}`);</script></html>
